[project]
name = "qg"
version = "0.1.0"
description = "Feature verification runner: queued, isolated, staged verification of one commit."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
qg = "qg.cli:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
